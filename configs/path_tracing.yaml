# Path Tracing Configuration File

algorithm: path_tracing  # ray_tracing, path_tracing, photon_mapping
samples_per_pixel: 128
mode: parallel  # parallel, sequential
max_bounces: 6

# Parallel rendering settings (used when mode is parallel)
region_type: column  # pixel, line, column, square
region_size: 5        # Number of lines, columns or rectangle size per thread
num_threads: 12
queue_type: std_queue  # std_queue

verbose: true  # Enable verbose output

tone_mapping: gamma 2.2  # none, equalization, equalization_gamma, equalization_clamp, gamma, clamp_gamma, reinhard
tone_mapping_max: 1.0  # Maximum value for clamps
# tone_mapping_gamma: 2.2  # Gamma value for gamma
# tone_mapping_key: 0.18  # Key value for reinhard
# tone_mapping_lwhite: 1.0  # White level for reinhard

# Bilateral filter settings (applied to indirect lighting only)
# Set to true to enable noise reduction on indirect lighting
bilateral_filter: true
bilateral_sigma_space: 3.0    # Spatial range (pixel distance)
bilateral_sigma_color: 0.2    # Color range (color similarity)