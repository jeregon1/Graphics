# Render Configuration
# Generated automatically

samples_per_pixel: 128
algorithm: path_tracing

mode: parallel

acceleration: none


# Parallel rendering settings
region_type: column

region_size: 16
num_threads: 8
queue_type: std_queue

# Photon mapping settings
k_photons: 50
radius: 0.1
n_paths: 10000
kernel: epanechnikov
max_bounces: 6

# Tone mapping settings
tone_mapping: gamma
tone_mapping_max: 1
tone_mapping_gamma: 2.2
tone_mapping_key: 0.18
tone_mapping_lwhite: 1

verbose: true

# Bilateral filter settings (applied to indirect lighting only)
bilateral_filter: false
bilateral_sigma_space: 3
bilateral_sigma_color: 0.2

