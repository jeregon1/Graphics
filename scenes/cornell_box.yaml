background: 0 0 0

camera:
  origin: 0 0 -3.5
  # left: -2 0 0
  # up:    0 -1 0
  forward: 0 0 3
  fov: 90
  pixels: 256 256

# White diffuse material with nested material properties
material: 1 1 1

# Floor (y = -1)
plane: 0 -1 0 1
# Ceiling (y = 1)
plane: 0 1 0 1

# Left wall (x = -1), red diffuse
material: 1 0 0
plane: -1 0 0 1
# Right wall (x = 1), green diffuse
material: 0 1 0
plane: 1 0 0 1
# Back wall (z = -3)
material: 
  specular: .8 .8 .8
plane: 0 0 1 3

# Spheres
# Left sphere
material: 
  # diffuse: 1 0 0
  specular: 1 1 1
  # transmittance: 2 2 2
sphere: -0.5 -0.7 0.25 0.3

# Right sphere
material: 
  # diffuse: 1 0 0
  # specular: 1 1 1
  transmittance: 2 2 2
sphere: 0.5 -0.7 -0.25 0.3

# Point light at ceiling center
light: 0 .5 0 2 2 2
