background: 0 0 0

camera:
  origin: 0 0 -3.5
  # left: -1 0 0
  # up: 0 1 0
  # forward: 0 0 3
  fov: 50
  pixels: 256 256

# White diffuse material with nested material properties
material:
  diffuse: 0.8 0.8 0.8      # diffuse color
  specular: 0.05 0.05 0.05  # specular color
  isEmissive: false         # emission flag

# Floor (y = -1)
plane: 0 1 0 1
# Ceiling (y = 1)
plane: 0 -1 0 1

# Left wall (x = -1), red diffuse
material: 1 0 0
plane: 1 0 0 1
# Right wall (x = 1), green diffuse
material: 0 1 0
plane: -1 0 0 1
# Back wall (z = -3)
material: 0.8 0.8 0.8
plane: 0 0 -1 1

# Spheres
# Left sphere
material: 1 1 1
sphere: -0.5 -0.7 0.25 0.3
# Right sphere
material: 1 1 1
sphere: 0.5 -0.7 -0.25 0.3

# Point light at ceiling center
light: 0 0.5 0 4 4 4
