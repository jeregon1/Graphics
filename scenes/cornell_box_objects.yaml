background: 0 0 0

camera:
  origin: 0 0 -3.5
  # left: -2 0 0
  # up:    0 -1 0
  forward: 0 0 3
  fov: 90
  pixels: 300 300

# White diffuse material with nested material properties
material: 1 1 1

# Floor (y = -1)
plane: 0 -1 0 1
# Ceiling (y = 1)
plane: 0 1 0 1

# Left wall (x = -1), red diffuse
material: 1 0 0
plane: -1 0 0 1
# Right wall (x = 1), green diffuse
material: 0 1 0
plane: 1 0 0 1
# Back wall (z = -3)
material: 
  specular: 1
plane: 0 0 1 3

# Spheres
# Left sphere
material: 
  diffuse: 0.1 0.1 0.1
  specular: 0.8     # Only one value needed and permitted
sphere: -0.5 -0.7 0.25 0.3

# Right sphere
material: 
  diffuse: 0.05 0.05 0.05
  specular: 0.1
  transmittance: 0.74  # Only one value needed and permitted
sphere: 0.5 -0.7 -0.25 0.3

cylinder:
  base: -1 .4 0
  axis: 1 0 0
  radius: 0.4
  height: .5

# points a b c
material: 
  transmittance: 0.5 0.5 0.5
triangle: -.5 .4 -.2   0 .85 .1   .5 .4 -.2

material:
  specular: .6
triangle: 0.7 0 .5   0.99 -.5 0   0.99 0 -.5

material: .3 0 .3
cone:
  base: 0 -.8 0
  axis: 1 1 1
  radius: 0.2
  height: .5

# Point light at ceiling center
light: 0 .5 0 2 2 2
